<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="34" fill="#1f2328" font-size="17" font-weight="bold" text-anchor="middle">Multicycle RISC-V</text>

  <!-- Controller -->
  <rect x="40" y="62" width="230" height="140" rx="6" fill="#f6f8fa" stroke="#0f766e" stroke-width="2"/>
  <text x="155" y="86" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="middle">Controller</text>
  <rect x="60" y="100" width="190" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="155" y="118" fill="#1f2328" font-size="12" text-anchor="middle">Control FSM (S0–S10)</text>
  <rect x="60" y="132" width="190" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="155" y="150" fill="#1f2328" font-size="12" text-anchor="middle">ALU Decoder</text>
  <rect x="60" y="164" width="190" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="155" y="182" fill="#1f2328" font-size="12" text-anchor="middle">Instruction Decoder</text>

  <!-- Datapath -->
  <rect x="370" y="62" width="230" height="140" rx="6" fill="#f6f8fa" stroke="#a16207" stroke-width="2"/>
  <text x="485" y="86" fill="#a16207" font-size="14" font-weight="bold" text-anchor="middle">Datapath</text>
  <rect x="390" y="100" width="88" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="434" y="118" fill="#1f2328" font-size="12" text-anchor="middle">PC / IR</text>
  <rect x="492" y="100" width="88" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="536" y="118" fill="#1f2328" font-size="12" text-anchor="middle">RegFile</text>
  <rect x="390" y="132" width="88" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="434" y="150" fill="#1f2328" font-size="12" text-anchor="middle">ALU</text>
  <rect x="492" y="132" width="88" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="536" y="150" fill="#1f2328" font-size="12" text-anchor="middle">Extend</text>
  <rect x="390" y="164" width="190" height="26" rx="3" fill="#ffffff" stroke="#9aa4ae"/>
  <text x="485" y="182" fill="#1f2328" font-size="12" text-anchor="middle">OldPC / ALUOut</text>

  <!-- control arrows -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#0f766e"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="270" y1="118" x2="368" y2="118" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
  <text x="319" y="110" fill="#0f766e" font-size="11" text-anchor="middle">control</text>
  <line x1="368" y1="160" x2="272" y2="160" stroke="#839496" stroke-width="2" marker-end="url(#b)"/>
  <text x="319" y="178" fill="#6b7280" font-size="11" text-anchor="middle">op / Zero</text>

  <!-- shared memory -->
  <rect x="200" y="248" width="240" height="48" rx="6" fill="#f6f8fa" stroke="#c2410c" stroke-width="2"/>
  <text x="320" y="270" fill="#c2410c" font-size="13" font-weight="bold" text-anchor="middle">Shared Memory</text>
  <text x="320" y="287" fill="#6b7280" font-size="11" text-anchor="middle">instructions + data, selected by AdrSrc</text>
  <line x1="485" y1="202" x2="430" y2="246" stroke="#839496" stroke-width="2" marker-end="url(#b)"/>
  <line x1="210" y1="246" x2="155" y2="202" stroke="#839496" stroke-width="2" marker-end="url(#b)"/>
</svg>
